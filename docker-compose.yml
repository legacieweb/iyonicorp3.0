services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/shopright
      - JWT_SECRET=${JWT_SECRET:-@7Switched}
      - VITE_APP_URL=${VITE_APP_URL}
      - VITE_API_URL=${VITE_API_URL}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.iyonicorp.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.iyonicorp.entrypoints=websecure"
      - "traefik.http.routers.iyonicorp.tls.certresolver=letsencrypt"
      - "traefik.http.services.iyonicorp.loadbalancer.server.port=5000"

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=shopright
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopright"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
